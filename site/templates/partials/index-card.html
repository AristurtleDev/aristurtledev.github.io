<li class="index-card">
  <div class="index-card-index">{{indexNumber}}</div>
  <div class="index-card-copy">
    <a class="index-card-title" href="{{href}}">{{title}}</a>
    <time class="index-card-meta" datetime="{{dateIso}}">{{dateDisplay}}</time>
    <p class="index-card-summary">{{summary}}</p>
  </div>
  <div class="index-card-links"><a href="{{href}}">Open →</a></div>
</li>
